server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Apenas os diretórios de estáticos versionados. Antes a regra pegava
    # qualquer URL terminada em .jpg/.png, então /media/{id}/{arquivo}.jpg era
    # procurada no disco pelo nginx e retornava 404 sem chegar ao Laravel.
    location ~* ^/(build|assets)/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}
